<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarStudio - Créateur Audio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden; /* Prevent scrolling, full app feel */
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Custom Checkbox as Toggle */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #a855f7;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #a855f7;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: transparent;
        }
        
        /* Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none; /* Let clicks pass through to the UI */
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative">

    <canvas id="visualizerCanvas"></canvas>

    <div class="relative z-10 w-full max-w-lg p-6 glass-panel rounded-3xl mx-4 flex flex-col gap-8 transition-all duration-500 hover:border-white/10">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-blue-500 flex items-center justify-center gap-2">
                <i class="ph-fill ph-waveform text-purple-400"></i> StellarStudio
            </h1>
            <p class="text-gray-400 text-sm mt-1">Créez. Effets. Magie.</p>
        </div>

        <!-- Recording Section -->
        <div class="flex flex-col items-center justify-center gap-4 py-4">
            <button id="recordBtn" class="w-24 h-24 rounded-full bg-red-500/20 text-red-500 border-2 border-red-500 flex items-center justify-center text-4xl transition-all duration-300 hover:bg-red-500/40 focus:outline-none shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                <i class="ph-fill ph-microphone"></i>
            </button>
            <span id="recordStatus" class="text-sm text-red-400 font-medium tracking-widest uppercase">Prêt à enregistrer</span>
        </div>

        <!-- Playback & Effects Controls (Hidden initially) -->
        <div id="controlsPanel" class="flex flex-col gap-6 opacity-30 pointer-events-none transition-opacity duration-500">
            
            <!-- Playback Controls -->
            <div class="flex items-center justify-between bg-white/5 rounded-2xl p-4 border border-white/5">
                <button id="playBtn" class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-xl hover:bg-white/20 transition text-white">
                    <i class="ph-fill ph-play"></i>
                </button>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold text-gray-300">Boucle (Loop)</span>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="loopToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out"/>
                        <label for="loopToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>
            </div>

            <!-- Effects Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <!-- Echo Effect -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="echoBtn">
                    <i class="ph ph-waves text-3xl text-gray-400 group-hover:text-blue-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300">Écho Spatial</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>

                <!-- Autotune Effect -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="autotuneBtn">
                    <i class="ph ph-magic-wand text-3xl text-gray-400 group-hover:text-purple-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300">Effet Robotique</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>

                <!-- Canon Effect -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="canonBtn">
                    <i class="ph ph-users text-3xl text-gray-400 group-hover:text-pink-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300 text-center">Voix Canon</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>
                
                <!-- Deep Voice -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="deepBtn">
                    <i class="ph ph-user-minus text-3xl text-gray-400 group-hover:text-emerald-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300">Voix Grave</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>

                <!-- Lo-Fi Radio -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="lofiBtn">
                    <i class="ph ph-radio text-3xl text-gray-400 group-hover:text-yellow-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300">Radio Lo-Fi</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>
                
                <!-- Alien -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center gap-3 cursor-pointer hover:bg-white/5 transition group" id="alienBtn">
                    <i class="ph ph-alien text-3xl text-gray-400 group-hover:text-green-400 transition"></i>
                    <span class="text-sm font-medium text-gray-300">Extraterrestre</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 indicator transition-colors"></div>
                </div>
            </div>

            <!-- Speed/Duration Slider -->
            <div class="glass-panel p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="ph ph-clock text-lg"></i> Durée / Vitesse
                    </span>
                    <span id="speedValue" class="text-xs text-purple-400 font-bold">1.0x</span>
                </div>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

    </div>

    <script>
        // --- 1. STATE & AUDIO VARIABLES ---
        let isRecording = false;
        let isPlaying = false;
        let audioContextStarted = false;

        // Tone.js nodes
        let mic;
        let recorder;
        let player;
        let analyser;
        
        // Effects nodes
        let echoEffect;
        let autotuneEffect; // We'll use a pitch shift + subtle chorus for a robotic/tuned feel
        let reverbEffect;
        let masterGain;
        
        let canonIn, canonOut, canonDelay1, canonDelay2, canonDelay3;
        let deepEffect;
        let lofiEffect;
        let alienEffect;

        // Effect States
        let state = {
            echo: false,
            autotune: false,
            loop: false,
            speed: 1.0,
            canon: false,
            deep: false,
            lofi: false,
            alien: false
        };

        // UI Elements
        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');
        const controlsPanel = document.getElementById('controlsPanel');
        const playBtn = document.getElementById('playBtn');
        const loopToggle = document.getElementById('loopToggle');
        const echoBtn = document.getElementById('echoBtn');
        const autotuneBtn = document.getElementById('autotuneBtn');
        const canonBtn = document.getElementById('canonBtn');
        const deepBtn = document.getElementById('deepBtn');
        const lofiBtn = document.getElementById('lofiBtn');
        const alienBtn = document.getElementById('alienBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // --- 2. AUDIO INITIALIZATION ---
        async function setupAudio() {
            if (audioContextStarted) return;
            
            await Tone.start();
            audioContextStarted = true;

            // Mic & Recorder
            mic = new Tone.UserMedia();
            recorder = new Tone.Recorder();
            
            // Visualizer Analyzer (connects to both mic and player)
            analyser = new Tone.Analyser("waveform", 512);
            masterGain = new Tone.Gain(1).toDestination();
            masterGain.connect(analyser);

            mic.connect(recorder);
            mic.connect(analyser); // Visualize mic input while recording

            // Player (will be initialized when we have a recording)
            player = new Tone.Player();
            player.loop = state.loop;

            // Effects
            echoEffect = new Tone.FeedbackDelay("8n", 0.5);
            reverbEffect = new Tone.Reverb(2.5); // Add space
            
            // "Autotune" simulation (Robotic/Hyperpop feel)
            autotuneEffect = new Tone.PitchShift({
                pitch: 4, // Shift up 4 semitones for a distinct effect
                windowSize: 0.05
            });

            // Canon setup (Multiple parallel delays)
            canonIn = new Tone.Gain(1);
            canonOut = new Tone.Gain(1);
            canonDelay1 = new Tone.Delay(0.7); // 0.7 sec
            canonDelay2 = new Tone.Delay(1.4); // 1.4 sec
            canonDelay3 = new Tone.Delay(2.1); // 2.1 sec
            
            canonIn.connect(canonOut); // Dry signal
            canonIn.connect(canonDelay1);
            canonDelay1.connect(canonOut);
            canonIn.connect(canonDelay2);
            canonDelay2.connect(canonOut);
            canonIn.connect(canonDelay3);
            canonDelay3.connect(canonOut);

            // New effects
            deepEffect = new Tone.PitchShift(-10); // Voix Grave
            lofiEffect = new Tone.BitCrusher(3); // Bitcrusher pour Radio
            alienEffect = new Tone.Chorus(4, 2.5, 1).start(); // Chorus bizarre

            // Initial Routing: Player -> Master
            player.connect(masterGain);
        }

        // --- 3. DYNAMIC ROUTING ---
        function updateAudioRouting() {
            if (!player) return;
            
            player.disconnect();
            let currentNode = player;

            if (state.autotune) {
                currentNode.connect(autotuneEffect);
                currentNode = autotuneEffect;
                currentNode.disconnect(); // clean up chain before proceeding
            }

            if (state.echo) {
                currentNode.connect(echoEffect);
                currentNode = echoEffect;
                currentNode.disconnect();
                
                // Add reverb to echo for lushness
                currentNode.connect(reverbEffect);
                currentNode = reverbEffect;
                currentNode.disconnect();
            }

            if (state.deep) {
                currentNode.connect(deepEffect);
                currentNode = deepEffect;
                currentNode.disconnect();
            }

            if (state.alien) {
                currentNode.connect(alienEffect);
                currentNode = alienEffect;
                currentNode.disconnect();
            }

            if (state.lofi) {
                currentNode.connect(lofiEffect);
                currentNode = lofiEffect;
                currentNode.disconnect();
            }

            if (state.canon) {
                currentNode.connect(canonIn);
                currentNode = canonOut;
                currentNode.disconnect(); // Disconnect canonOut from previous mappings
            }

            currentNode.connect(masterGain);
        }

        // --- 4. EVENT LISTENERS ---

        // Record Button
        recordBtn.addEventListener('click', async () => {
            if (!audioContextStarted) await setupAudio();

            if (!isRecording) {
                // Start Recording
                try {
                    await mic.open();
                    recorder.start();
                    isRecording = true;
                    
                    // UI Update
                    recordBtn.classList.add('recording-pulse', 'bg-red-500', 'text-white');
                    recordBtn.classList.remove('bg-red-500/20', 'text-red-500');
                    recordBtn.innerHTML = '<i class="ph-fill ph-stop text-4xl"></i>';
                    recordStatus.innerText = "Enregistrement en cours...";
                    controlsPanel.classList.add('opacity-30', 'pointer-events-none');
                    controlsPanel.classList.remove('opacity-100', 'pointer-events-auto');
                    
                    if (isPlaying) stopPlayback();

                } catch (e) {
                    alert("Accès au microphone refusé ou erreur.");
                    console.error(e);
                }
            } else {
                // Stop Recording
                const recordingBlob = await recorder.stop();
                mic.close();
                isRecording = false;

                // Load recording into player
                const recordingUrl = URL.createObjectURL(recordingBlob);
                await player.load(recordingUrl);

                // UI Update
                recordBtn.classList.remove('recording-pulse', 'bg-red-500', 'text-white');
                recordBtn.classList.add('bg-red-500/20', 'text-red-500');
                recordBtn.innerHTML = '<i class="ph-fill ph-microphone text-4xl"></i>';
                recordStatus.innerText = "Nouvel enregistrement terminé";
                recordStatus.classList.replace('text-red-400', 'text-green-400');
                
                controlsPanel.classList.remove('opacity-30', 'pointer-events-none');
                controlsPanel.classList.add('opacity-100', 'pointer-events-auto');
            }
        });

        // Play/Stop Button
        playBtn.addEventListener('click', () => {
            if (!player || !player.loaded) return;

            if (isPlaying) {
                stopPlayback();
            } else {
                player.start();
                isPlaying = true;
                playBtn.innerHTML = '<i class="ph-fill ph-stop"></i>';
                playBtn.classList.add('bg-purple-500/50', 'text-white', 'border-purple-500');
                
                // If not looping, reset button when finished
                if (!state.loop) {
                    // Calculate duration based on playback rate
                    const dur = player.buffer.duration / player.playbackRate;
                    setTimeout(() => {
                        if (isPlaying && !state.loop) stopPlayback();
                    }, dur * 1000);
                }
            }
        });

        function stopPlayback() {
            if(player) player.stop();
            isPlaying = false;
            playBtn.innerHTML = '<i class="ph-fill ph-play"></i>';
            playBtn.classList.remove('bg-purple-500/50', 'text-white', 'border-purple-500');
        }

        // Loop Toggle
        loopToggle.addEventListener('change', (e) => {
            state.loop = e.target.checked;
            if (player) player.loop = state.loop;
        });

        // Echo Toggle
        echoBtn.addEventListener('click', () => {
            state.echo = !state.echo;
            updateAudioRouting();
            
            const icon = echoBtn.querySelector('i');
            const indicator = echoBtn.querySelector('.indicator');
            
            if (state.echo) {
                echoBtn.classList.add('border-blue-500/50', 'bg-blue-500/10');
                icon.classList.replace('text-gray-400', 'text-blue-400');
                indicator.classList.replace('bg-gray-600', 'bg-blue-500');
                indicator.classList.add('shadow-[0_0_10px_#3b82f6]');
            } else {
                echoBtn.classList.remove('border-blue-500/50', 'bg-blue-500/10');
                icon.classList.replace('text-blue-400', 'text-gray-400');
                indicator.classList.replace('bg-blue-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#3b82f6]');
            }
        });

        // Autotune Toggle
        autotuneBtn.addEventListener('click', () => {
            state.autotune = !state.autotune;
            updateAudioRouting();
            
            const icon = autotuneBtn.querySelector('i');
            const indicator = autotuneBtn.querySelector('.indicator');
            
            if (state.autotune) {
                autotuneBtn.classList.add('border-purple-500/50', 'bg-purple-500/10');
                icon.classList.replace('text-gray-400', 'text-purple-400');
                indicator.classList.replace('bg-gray-600', 'bg-purple-500');
                indicator.classList.add('shadow-[0_0_10px_#a855f7]');
            } else {
                autotuneBtn.classList.remove('border-purple-500/50', 'bg-purple-500/10');
                icon.classList.replace('text-purple-400', 'text-gray-400');
                indicator.classList.replace('bg-purple-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#a855f7]');
            }
        });

        // Canon Toggle
        canonBtn.addEventListener('click', () => {
            state.canon = !state.canon;
            updateAudioRouting();
            const icon = canonBtn.querySelector('i');
            const indicator = canonBtn.querySelector('.indicator');
            if (state.canon) {
                canonBtn.classList.add('border-pink-500/50', 'bg-pink-500/10');
                icon.classList.replace('text-gray-400', 'text-pink-400');
                indicator.classList.replace('bg-gray-600', 'bg-pink-500');
                indicator.classList.add('shadow-[0_0_10px_#ec4899]');
            } else {
                canonBtn.classList.remove('border-pink-500/50', 'bg-pink-500/10');
                icon.classList.replace('text-pink-400', 'text-gray-400');
                indicator.classList.replace('bg-pink-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#ec4899]');
            }
        });

        // Deep Voice Toggle
        deepBtn.addEventListener('click', () => {
            state.deep = !state.deep;
            updateAudioRouting();
            const icon = deepBtn.querySelector('i');
            const indicator = deepBtn.querySelector('.indicator');
            if (state.deep) {
                deepBtn.classList.add('border-emerald-500/50', 'bg-emerald-500/10');
                icon.classList.replace('text-gray-400', 'text-emerald-400');
                indicator.classList.replace('bg-gray-600', 'bg-emerald-500');
                indicator.classList.add('shadow-[0_0_10px_#10b981]');
            } else {
                deepBtn.classList.remove('border-emerald-500/50', 'bg-emerald-500/10');
                icon.classList.replace('text-emerald-400', 'text-gray-400');
                indicator.classList.replace('bg-emerald-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#10b981]');
            }
        });

        // Lo-Fi Toggle
        lofiBtn.addEventListener('click', () => {
            state.lofi = !state.lofi;
            updateAudioRouting();
            const icon = lofiBtn.querySelector('i');
            const indicator = lofiBtn.querySelector('.indicator');
            if (state.lofi) {
                lofiBtn.classList.add('border-yellow-500/50', 'bg-yellow-500/10');
                icon.classList.replace('text-gray-400', 'text-yellow-400');
                indicator.classList.replace('bg-gray-600', 'bg-yellow-500');
                indicator.classList.add('shadow-[0_0_10px_#eab308]');
            } else {
                lofiBtn.classList.remove('border-yellow-500/50', 'bg-yellow-500/10');
                icon.classList.replace('text-yellow-400', 'text-gray-400');
                indicator.classList.replace('bg-yellow-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#eab308]');
            }
        });

        // Alien Toggle
        alienBtn.addEventListener('click', () => {
            state.alien = !state.alien;
            updateAudioRouting();
            const icon = alienBtn.querySelector('i');
            const indicator = alienBtn.querySelector('.indicator');
            if (state.alien) {
                alienBtn.classList.add('border-green-500/50', 'bg-green-500/10');
                icon.classList.replace('text-gray-400', 'text-green-400');
                indicator.classList.replace('bg-gray-600', 'bg-green-500');
                indicator.classList.add('shadow-[0_0_10px_#22c55e]');
            } else {
                alienBtn.classList.remove('border-green-500/50', 'bg-green-500/10');
                icon.classList.replace('text-green-400', 'text-gray-400');
                indicator.classList.replace('bg-green-500', 'bg-gray-600');
                indicator.classList.remove('shadow-[0_0_10px_#22c55e]');
            }
        });

        // Speed Slider
        speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            state.speed = val;
            speedValue.innerText = val.toFixed(1) + 'x';
            if (player) {
                player.playbackRate = val;
            }
        });


        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 150;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.baseRadius = Math.random() * 1.5 + 0.5;
                this.radius = this.baseRadius;
                this.baseAlpha = Math.random() * 0.5 + 0.1;
                this.alpha = this.baseAlpha;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                // Color variation (white/blue/purple)
                const colors = ['255,255,255', '168,85,247', '59,130,246'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update(audioIntensity) {
                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // React to audio
                // Intensity is a value between 0 and 1
                const boost = audioIntensity * 15; // Max radius increase
                
                // Smoothly interpolate radius for fluid animation
                this.radius += ((this.baseRadius + boost) - this.radius) * 0.2;
                
                // Brighten alpha based on audio
                this.alpha = Math.min(1, this.baseAlpha + (audioIntensity * 0.8));
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.shadowBlur = this.radius * 4;
                ctx.shadowColor = `rgba(${this.color}, ${this.alpha})`;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset for performance
            }
        }

        // Initialize particles
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function getAudioIntensity() {
            if (!analyser) return 0;
            const values = analyser.getValue(); // Float32Array
            let sum = 0;
            for (let i = 0; i < values.length; i++) {
                sum += Math.abs(values[i]);
            }
            const average = sum / values.length;
            // Map average (usually 0 to 0.5) to a 0-1 scale, adding a slight curve
            return Math.min(1, average * 3); 
        }

        function animate() {
            // Dark trailing effect instead of clearRect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            const intensity = getAudioIntensity();

            // Draw connecting lines if intensity is high enough (Star constellation effect)
            if (intensity > 0.1) {
                ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 80 + (intensity * 50)) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(168, 85, 247, ${ (0.2 * intensity) * (1 - dist/150) })`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            particles.forEach(p => {
                p.update(intensity);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Start visualizer loop immediately
        animate();

    </script>
</body>
</html>
